services:
  - type: web
    name: nicebot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/status
    disk:
      name: auth-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OWNER_NUMBER
        value: 2347049397307
      - key: BOT_TOKEN
        sync: false
      - key: AUTH_DIR
        value: /var/data/auth_state
